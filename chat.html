<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08091e">
  <title>Discussion | YOKAIRA</title>

<link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #08091e;
      --panel: rgba(17, 19, 55, .88);
      --border: rgba(139, 103, 255, .24);
      --purple: #a56aff;
      --purple-light: #c3a1ff;
      --text: #f7f5ff;
      --muted: #a5a0d6;
      --green: #00e7a1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; color: var(--text); font-family: Arial, sans-serif;
      background: var(--bg); display: flex; flex-direction: column; padding-bottom: 80px;
    }

    header {
      position: sticky; top: 0; z-index: 20; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10, 12, 39, .95); border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { background: none; border: 0; color: white; font-size: 1.4rem; cursor: pointer; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #ec4899); display: grid; place-items: center; font-weight: bold; color: white; object-fit: cover; }
    .chat-title { font-weight: bold; font-size: 0.95rem; }
    .chat-status { font-size: .7rem; color: var(--green); }

    main { flex: 1; width: min(760px, 94%); margin: 0 auto; padding: 15px 0; display: flex; flex-direction: column; justify-content: flex-end; }
    .messages-container { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 180px); overflow-y: auto; padding: 10px 5px; }

    .message-row { display: flex; flex-direction: column; max-width: 75%; }
    .message-row.received { align-self: flex-start; }
    .message-row.sent { align-self: flex-end; align-items: flex-end; }

    .message-bubble { padding: 11px 15px; border-radius: 18px; font-size: .92rem; line-height: 1.45; word-break: break-word; }
    .message-row.received .message-bubble { background: rgba(32, 31, 80, .85); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .message-row.sent .message-bubble { background: #0084ff; color: #fff; border-bottom-right-radius: 4px; }
    .message-img { max-width: 100%; border-radius: 12px; margin-top: 5px; max-height: 220px; object-fit: cover; }

    .chat-form {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: rgba(10, 12, 39, .98); border-top: 1px solid var(--border);
      position: fixed; bottom: 0; left: 0; right: 0;
    }
    .chat-tool-btn { background: none; border: 0; color: var(--purple); font-size: 1.3rem; cursor: pointer; }
    .chat-input-wrap { flex: 1; background: rgba(30, 29, 75, .76); border: 1px solid var(--border); border-radius: 22px; padding: 8px 14px; }
    .chat-input { width: 100%; background: transparent; border: 0; outline: none; color: white; font-size: 0.95rem; }
    .file-input { display: none; }
    
    .send-btn {
      background: var(--purple);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(165, 106, 255, 0.4);
      transition: 0.2s;
    }
    .send-btn:hover { background: #b482ff; }

    .empty-chat { text-align: center; color: var(--muted); font-size: .88rem; margin: auto 0; padding: 20px; }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='messages.html'">‹</button>
    <div class="chat-avatar" id="headerAvatar">Y</div>
    <div>
      <div id="headerName" class="chat-title">Chargement...</div>
      <div class="chat-status">● En ligne</div>
    </div>
  </div>
</header>

<main>
  <div id="messagesContainer" class="messages-container">
    <div class="empty-chat">Ouverture de la discussion...</div>
  </div>

  <form id="chatForm" class="chat-form">
    <label for="mediaInput" class="chat-tool-btn" title="Envoyer une photo">🖼️</label>
    <input type="file" id="mediaInput" class="file-input" accept="image/*">
    <div class="chat-input-wrap">
      <input type="text" id="messageInput" class="chat-input" placeholder="Aa" autocomplete="off" maxlength="1000">
    </div>
    <button type="submit" class="send-btn" title="Envoyer">➔</button>
  </form>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGfNN8L3Nepdn8D9ocz9ylVB_6mKbIVcI",
    authDomain: "yokaira-46d8f.firebaseapp.com",
    projectId: "yokaira-46d8f",
    storageBucket: "yokaira-46d8f.firebasestorage.app",
    messagingSenderId: "1074371889355",
    appId: "1:1074371889355:web:e358704dd8d7b1a2ceb34e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const recipientId = urlParams.get("id");
  const recipientName = urlParams.get("name") || "Membre";

  document.getElementById("headerName").textContent = recipientName;
  const headerAvatar = document.getElementById("headerAvatar");
  const savedPhoto = recipientId ? localStorage.getItem("yokairaProfilePhoto_" + recipientId) : null;
  if (savedPhoto) {
    headerAvatar.outerHTML = `<img src="${savedPhoto}" id="headerAvatar" class="chat-avatar" alt="">`;
  } else {
    headerAvatar.textContent = recipientName.charAt(0).toUpperCase();
  }

  let currentUser = null;
  let chatId = null;
  let selectedMedia = null;

  onAuthStateChanged(auth, user => {
    if (!user) { window.location.replace("./connexion.html"); return; }
    currentUser = user;
    if (!recipientId) return;

    chatId = [user.uid, recipientId].sort().join("_");
    loadMessagesFast();
  });

  document.getElementById("mediaInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => { selectedMedia = event.target.result; document.getElementById("messageInput").placeholder = "Image prête à envoyer"; };
    reader.readAsDataURL(file);
  });

  function loadMessagesFast() {
    const q = query(
      collection(db, "privateMessages"),
      where("chatId", "==", chatId)
    );

    onSnapshot(q, snapshot => {
      if (snapshot.empty) {
        document.getElementById("messagesContainer").innerHTML = `<div class="empty-chat">Début de la discussion avec ${recipientName} ⚡</div>`;
        return;
      }

      let docs = [];
      snapshot.forEach(docSnap => {
        docs.push(docSnap.data());
      });

      // Tri rigoureux en JavaScript pour s'assurer que tout s'affiche dans l'ordre chronologique
      docs.sort((a, b) => {
        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
        return timeA - timeB;
      });

      let html = "";
      docs.forEach(msg => {
        const isSent = msg.senderId === currentUser.uid;
        html += `
          <div class="message-row ${isSent ? 'sent' : 'received'}">
            <div class="message-bubble">
              ${msg.text ? escapeHTML(msg.text) : ''}
              ${msg.mediaUrl ? `<img src="${msg.mediaUrl}" class="message-img" alt="">` : ''}
            </div>
          </div>
        `;
      });

      const container = document.getElementById("messagesContainer");
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
      
      localStorage.setItem("lastSeenMsg_" + chatId, Date.now());
    }, err => {
      console.error("Erreur de chargement des messages :", err);
    });
  }

  document.getElementById("chatForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text && !selectedMedia) return;

    const t = text;
    const m = selectedMedia;
    input.value = "";
    input.placeholder = "Aa";
    selectedMedia = null;

    try {
      await addDoc(collection(db, "privateMessages"), {
        chatId: chatId,
        senderId: currentUser.uid,
        text: t,
        mediaUrl: m || "",
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      alert("Erreur d'envoi.");
    }
  });

  function escapeHTML(str) {
    return String(str ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
  }
</script>

</body>
</html>
