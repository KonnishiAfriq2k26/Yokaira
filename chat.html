<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08091e">
  <title>Discussion | YOKAIRA</title>

  <style>
    :root {
      --bg: #08091e;
      --panel: rgba(17, 19, 55, .88);
      --border: rgba(139, 103, 255, .24);
      --purple: #a56aff;
      --purple-light: #c3a1ff;
      --text: #f7f5ff;
      --muted: #a5a0d6;
      --green: #00e7a1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 12, 39, .95);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: 0;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: grid;
      place-items: center;
      font-weight: bold;
      color: white;
      object-fit: cover;
    }

    .chat-title { font-weight: bold; font-size: 0.95rem; }
    .chat-status { font-size: .7rem; color: var(--muted); }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 1.2rem;
      color: var(--purple-light);
    }

    main {
      flex: 1;
      width: min(760px, 94%);
      margin: 0 auto;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .messages-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding: 10px 5px;
      margin-bottom: 15px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message-row.received { align-self: flex-start; }
    .message-row.sent { align-self: flex-end; align-items: flex-end; }

    .message-bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: .92rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .message-row.received .message-bubble {
      background: rgba(32, 31, 80, .85);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message-row.sent .message-bubble {
      background: #0084ff;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 5px;
      max-height: 250px;
      object-fit: cover;
    }

    .reply-preview-box {
      font-size: 0.78rem;
      background: rgba(0,0,0,0.2);
      padding: 4px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      border-left: 3px solid var(--purple);
      color: var(--muted);
    }

    /* Barre de saisie style Messenger */
    .chat-form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(10, 12, 39, .95);
      border-top: 1px solid var(--border);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .chat-tool-btn {
      background: none;
      border: 0;
      color: var(--purple);
      font-size: 1.4rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .chat-input-wrap {
      flex: 1;
      background: rgba(30, 29, 75, .76);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      background: transparent;
      border: 0;
      outline: none;
      color: white;
      font-size: 0.95rem;
    }

    .chat-input::placeholder { color: var(--muted); }

    .file-input { display: none; }

    .empty-chat {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      margin: auto 0;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='messages.html'">‹</button>
    <div class="chat-avatar" id="headerAvatar">Y</div>
    <div>
      <div id="headerName" class="chat-title">Chargement...</div>
      <div class="chat-status" id="headerStatus">En ligne</div>
    </div>
  </div>
  <div class="header-icons">
    <span>📞</span>
    <span>📹</span>
    <span>⚙️</span>
  </div>
</header>

<main>
  <div id="messagesContainer" class="messages-container">
    <div class="empty-chat">Chargement de la discussion...</div>
  </div>

  <form id="chatForm" class="chat-form">
    <label for="mediaInput" class="chat-tool-btn" title="Envoyer une photo">🖼️</label>
    <input type="file" id="mediaInput" class="file-input" accept="image/*">

    <button type="button" class="chat-tool-btn" title="Message vocal">🎙️</button>

    <div class="chat-input-wrap">
      <input type="text" id="messageInput" class="chat-input" placeholder="Aa" autocomplete="off" maxlength="1000">
    </div>

    <button type="submit" class="chat-tool-btn" style="color: #0084ff;" title="Envoyer">👍</button>
  </form>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGfNN8L3Nepdn8D9ocz9ylVB_6mKbIVcI",
    authDomain: "yokaira-46d8f.firebaseapp.com",
    projectId: "yokaira-46d8f",
    storageBucket: "yokaira-46d8f.firebasestorage.app",
    messagingSenderId: "1074371889355",
    appId: "1:1074371889355:web:e358704dd8d7b1a2ceb34e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const recipientId = urlParams.get("id");
  const recipientName = urlParams.get("name") || "Membre";

  const headerName = document.getElementById("headerName");
  const headerAvatar = document.getElementById("headerAvatar");
  const messagesContainer = document.getElementById("messagesContainer");
  const chatForm = document.getElementById("chatForm");
  const messageInput = document.getElementById("messageInput");
  const mediaInput = document.getElementById("mediaInput");

  headerName.textContent = recipientName;
  const initial = recipientName.charAt(0).toUpperCase();
  
  if (recipientId) {
    const savedPhoto = localStorage.getItem("yokairaProfilePhoto_" + recipientId);
    if (savedPhoto) {
      headerAvatar.outerHTML = `<img src="${savedPhoto}" id="headerAvatar" class="chat-avatar" alt="Avatar">`;
    } else {
      headerAvatar.textContent = initial;
    }
  }

  let currentUser = null;
  let chatId = null;
  let selectedMediaData = null;

  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.replace("./connexion.html");
      return;
    }
    currentUser = user;

    if (!recipientId) {
      messagesContainer.innerHTML = `<div class="empty-chat">Aucun destinataire sélectionné.</div>`;
      return;
    }

    // Identifiant de chat stable basé sur les deux UID triés
    chatId = [user.uid, recipientId].sort().join("_");
    loadMessages();
  });

  mediaInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) {
      alert("L'image est trop lourde (Max 3 Mo).");
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      selectedMediaData = event.target.result;
      messageInput.placeholder = "Image jointe (prête à envoyer)";
    };
    reader.readAsDataURL(file);
  });

  function loadMessages() {
    // Utilisation d'une collection racine "privateMessages" indexée par chatId pour éviter les blocages Firestore
    const q = query(
      collection(db, "privateMessages"),
      where("chatId", "==", chatId),
      orderBy("createdAt", "asc")
    );

    onSnapshot(q, snapshot => {
      if (snapshot.empty) {
        messagesContainer.innerHTML = `<div class="empty-chat">Discutez en toute sécurité dans l'univers YOKAIRA. ⚡</div>`;
        return;
      }

      let html = "";
      snapshot.forEach(docSnap => {
        const msg = docSnap.data();
        const isSent = msg.senderId === currentUser.uid;

        let mediaHtml = "";
        if (msg.mediaUrl) {
          mediaHtml = `<img src="${msg.mediaUrl}" class="message-img" alt="Média">`;
        }

        html += `
          <div class="message-row ${isSent ? 'sent' : 'received'}">
            <div class="message-bubble">
              ${msg.text ? escapeHTML(msg.text) : ''}
              ${mediaHtml}
            </div>
          </div>
        `;
      });

      messagesContainer.innerHTML = html;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, error => {
      console.error("Erreur de chargement des messages :", error);
    });
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text && !selectedMediaData) return;
    if (!currentUser || !chatId) return;

    const textToSend = text;
    const mediaToSend = selectedMediaData;

    messageInput.value = "";
    messageInput.placeholder = "Aa";
    selectedMediaData = null;
    mediaInput.value = "";

    try {
      await addDoc(collection(db, "privateMessages"), {
        chatId: chatId,
        senderId: currentUser.uid,
        senderName: currentUser.displayName || "Membre",
        text: textToSend,
        mediaUrl: mediaToSend || "",
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error("Erreur d'envoi :", err);
      alert("Impossible d'envoyer le message. Vérifie que tes règles Firestore autorisent l'écriture sur la collection 'privateMessages'.");
    }
  });

  function escapeHTML(str) {
    return String(str ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
  }
</script>

</body>
</html>
