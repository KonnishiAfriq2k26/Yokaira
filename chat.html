<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090914">

  <title>Discussion | YOKAIRA</title>

  <style>
    :root {
      --bg: #080812;
      --surface: #111122;
      --surface2: #19192e;
      --border: rgba(155, 92, 255, .23);
      --purple: #a855f7;
      --cyan: #22d3ee;
      --pink: #f472b6;
      --text: #f5f3ff;
      --muted: #9b9ab8;
    }

    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 10% 0%, #25123f 0%, transparent 38%),
        radial-gradient(ellipse at 100% 30%, #101c3a 0%, transparent 35%),
        var(--bg);
      font-family: Inter, system-ui, Arial, sans-serif;
      padding-bottom: 110px;
      display: flex;
      flex-direction: column;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(8, 8, 18, .88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: #a855f725;
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      transition: .2s;
    }
    .back-btn:hover {
      border-color: var(--cyan);
    }

    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: white;
      font-size: .9rem;
      object-fit: cover;
    }

    .chat-title {
      font-weight: 850;
      font-size: 1rem;
    }

    .chat-status {
      font-size: .75rem;
      color: #86efac;
    }

    main {
      flex: 1;
      width: min(760px, 94%);
      margin: 0 auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .messages-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
      padding: 10px 5px;
      margin-bottom: 20px;
    }

    .message {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 16px;
      font-size: .92rem;
      line-height: 1.5;
      word-break: break-word;
      animation: appear .25s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.received {
      background: var(--surface2);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.sent {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px #a855f730;
    }

    .message-time {
      font-size: .65rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      text-align: right;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      background: linear-gradient(145deg, #17172bdc, #0e0e1deF);
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 30px #00000040;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      background: #090918;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      outline: none;
    }
    .chat-input:focus {
      border-color: var(--cyan);
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), #a5f3fc);
      color: #080812;
      border: 0;
      font-size: 1.1rem;
      font-weight: 900;
      display: grid;
      place-items: center;
      transition: .2s;
    }
    .send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 15px #22d3ee40;
    }

    .empty-chat {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      margin: auto 0;
      padding: 20px;
    }

    /* Barre de navigation unifiée */
    .yokaira-bottom-nav {
      position: fixed;
      z-index: 99999;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 3px max(12px, env(safe-area-inset-bottom));
      background: rgba(8, 9, 30, 0.97);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(144, 111, 255, 0.4);
      border-radius: 20px 20px 0 0;
    }

    .yokaira-bottom-nav a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #9892d4;
      font-size: 11px;
    }

    .yokaira-bottom-nav .icon {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .yokaira-bottom-nav a.active {
      color: #a56aff;
      font-weight: bold;
    }

    @media (min-width: 700px) {
      body {
        max-width: 760px;
        margin: 0 auto;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }

      .yokaira-bottom-nav {
        left: 50%;
        right: auto;
        width: 100%;
        max-width: 760px;
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

<header>
  <a href="messages.html" class="back-btn" aria-label="Retour">←</a>
  <div class="chat-header-info">
    <div id="headerAvatar" class="chat-avatar">Y</div>
    <div>
      <div id="headerName" class="chat-title">Chargement...</div>
      <div class="chat-status">● En ligne</div>
    </div>
  </div>
</header>

<main>
  <div id="messagesContainer" class="messages-container">
    <div class="empty-chat">Chargement de la discussion...</div>
  </div>

  <form id="chatForm" class="chat-form">
    <input type="text" id="messageInput" class="chat-input" placeholder="Écris ton message..." required autocomplete="off" maxlength="1000">
    <button type="submit" class="send-btn" aria-label="Envoyer">➤</button>
  </form>
</main>

<!-- BARRE DE NAVIGATION DU BAS UNIFIÉE -->
<nav class="yokaira-bottom-nav">
    <a href="univers.html" data-page="univers.html">
        <span class="icon">🌌</span>Univers
    </a>
    <a href="messages.html" data-page="messages.html" class="active">
        <span class="icon">💬</span>Discussions
    </a>
    <a href="boutique.html" data-page="boutique.html">
        <span class="icon">🛍️</span>Boutique
    </a>
    <a href="avatar.html" data-page="avatar.html">
        <span class="icon">👤</span>Avatar
    </a>
    <a href="profil.html" data-page="profil.html">
        <span class="icon">⚡</span>Profil
    </a>
</nav>

<script>
    const pageActuelle = location.pathname.split("/").pop();
    document.querySelectorAll(".yokaira-bottom-nav a").forEach(lien => {
        if (lien.dataset.page === pageActuelle) {
            lien.classList.add("active");
        }
    });
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGfNN8L3Nepdn8D9ocz9ylVB_6mKbIVcI",
    authDomain: "yokaira-46d8f.firebaseapp.com",
    projectId: "yokaira-46d8f",
    storageBucket: "yokaira-46d8f.firebasestorage.app",
    messagingSenderId: "1074371889355",
    appId: "1:1074371889355:web:e358704dd8d7b1a2ceb34e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const recipientId = urlParams.get("id");
  const recipientName = urlParams.get("name") || "Membre";

  const headerName = document.getElementById("headerName");
  const headerAvatar = document.getElementById("headerAvatar");
  const messagesContainer = document.getElementById("messagesContainer");
  const chatForm = document.getElementById("chatForm");
  const messageInput = document.getElementById("messageInput");

  headerName.textContent = recipientName;
  const initial = recipientName.charAt(0).toUpperCase();
  
  // Affichage de la photo de profil du destinataire si elle existe
  if (recipientId) {
    const savedPhoto = localStorage.getItem("yokairaProfilePhoto_" + recipientId);
    if (savedPhoto) {
      headerAvatar.outerHTML = `<img src="${savedPhoto}" id="headerAvatar" class="chat-avatar" alt="Avatar">`;
    } else {
      headerAvatar.textContent = initial;
    }
  }

  let currentUser = null;
  let chatId = null;

  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.replace("./connexion.html");
      return;
    }
    currentUser = user;

    if (!recipientId) {
      messagesContainer.innerHTML = `<div class="empty-chat">Aucun destinataire sélectionné.</div>`;
      return;
    }

    // Création d'un ID de discussion unique basé sur les deux UID (pour que les deux utilisateurs partagent la même conversation)
    chatId = [user.uid, recipientId].sort().join("_");

    loadMessages();
  });

  function loadMessages() {
    const messagesRef = collection(db, "chats", chatId, "messages");
    const q = query(messagesRef, orderBy("createdAt", "asc"));

    onSnapshot(q, snapshot => {
      if (snapshot.empty) {
        messagesContainer.innerHTML = `<div class="empty-chat">C'est le début de votre discussion avec ${recipientName}. Envoyez un premier message ! ⚡</div>`;
        return;
      }

      let html = "";
      snapshot.forEach(docSnap => {
        const msg = docSnap.data();
        const isSent = msg.senderId === currentUser.uid;
        const time = msg.createdAt?.toDate ? msg.createdAt.toDate().toLocaleTimeString("fr-FR", { hour: '2-digit', minute: '2-digit' }) : "À l'instant";

        html += `
          <div class="message ${isSent ? 'sent' : 'received'}">
            <div>${escapeHTML(msg.text)}</div>
            <div class="message-time">${time}</div>
          </div>
        `;
      });

      messagesContainer.innerHTML = html;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, error => {
      console.error("Erreur de chargement des messages :", error);
    });
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !currentUser || !chatId) return;

    messageInput.value = "";

    try {
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: currentUser.uid,
        senderName: currentUser.displayName || currentUser.email.split("@")[0],
        text: text,
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error("Erreur d'envoi :", err);
      alert("Impossible d'envoyer le message.");
    }
  });

  function escapeHTML(str) {
    return String(str ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
  }
</script>

</body>
</html>
