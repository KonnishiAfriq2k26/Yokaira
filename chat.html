<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08091e">
  <title>Discussion | YOKAIRA</title>

  <style>
    :root {
      --bg: #08091e;
      --panel: rgba(17, 19, 55, .88);
      --border: rgba(139, 103, 255, .24);
      --purple: #a56aff;
      --purple-light: #c3a1ff;
      --text: #f7f5ff;
      --muted: #a5a0d6;
      --green: #00e7a1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(10, 12, 39, .95);
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: rgba(87, 52, 157, .22);
      border: 1px solid var(--border);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      text-decoration: none;
    }

    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: grid;
      place-items: center;
      font-weight: bold;
      color: white;
      object-fit: cover;
    }

    .chat-title { font-weight: bold; font-size: 1rem; }
    .chat-status { font-size: .75rem; color: var(--green); }

    main {
      flex: 1;
      width: min(760px, 94%);
      margin: 0 auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .messages-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding: 10px 5px;
      margin-bottom: 15px;
    }

    .message {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 16px;
      font-size: .92rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.received {
      background: rgba(32, 31, 80, .78);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.sent {
      background: linear-gradient(135deg, #5d32a9, #29165c);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      border: 1px solid var(--purple);
    }

    .message-time {
      font-size: .65rem;
      color: var(--muted);
      margin-top: 4px;
      text-align: right;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      background: var(--panel);
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 15px;
      background: #090918;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: white;
      outline: none;
    }
    .chat-input:focus { border-color: var(--purple); }

    .send-btn {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: var(--purple);
      color: white;
      border: 0;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .empty-chat {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      margin: auto 0;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <a href="messages.html" class="back-btn">←</a>
  <div class="chat-avatar" id="headerAvatar">Y</div>
  <div>
    <div id="headerName" class="chat-title">Chargement...</div>
    <div class="chat-status">● En ligne</div>
  </div>
</header>

<main>
  <div id="messagesContainer" class="messages-container">
    <div class="empty-chat">Chargement de la discussion...</div>
  </div>

  <form id="chatForm" class="chat-form">
    <input type="text" id="messageInput" class="chat-input" placeholder="Écris ton message..." required autocomplete="off" maxlength="1000">
    <button type="submit" class="send-btn">➤</button>
  </form>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGfNN8L3Nepdn8D9ocz9ylVB_6mKbIVcI",
    authDomain: "yokaira-46d8f.firebaseapp.com",
    projectId: "yokaira-46d8f",
    storageBucket: "yokaira-46d8f.firebasestorage.app",
    messagingSenderId: "1074371889355",
    appId: "1:1074371889355:web:e358704dd8d7b1a2ceb34e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const recipientId = urlParams.get("id");
  const recipientName = urlParams.get("name") || "Membre";

  const headerName = document.getElementById("headerName");
  const headerAvatar = document.getElementById("headerAvatar");
  const messagesContainer = document.getElementById("messagesContainer");
  const chatForm = document.getElementById("chatForm");
  const messageInput = document.getElementById("messageInput");

  headerName.textContent = recipientName;
  const initial = recipientName.charAt(0).toUpperCase();
  
  if (recipientId) {
    const savedPhoto = localStorage.getItem("yokairaProfilePhoto_" + recipientId);
    if (savedPhoto) {
      headerAvatar.outerHTML = `<img src="${savedPhoto}" id="headerAvatar" class="chat-avatar" alt="Avatar">`;
    } else {
      headerAvatar.textContent = initial;
    }
  }

  let currentUser = null;
  let chatId = null;

  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.replace("./connexion.html");
      return;
    }
    currentUser = user;

    if (!recipientId) {
      messagesContainer.innerHTML = `<div class="empty-chat">Aucun destinataire sélectionné.</div>`;
      return;
    }

    // Génération d'un ID de chat stable combinant les deux UID triés alphabétiquement
    chatId = [user.uid, recipientId].sort().join("_");

    loadMessages();
  });

  function loadMessages() {
    const messagesRef = collection(db, "chats", chatId, "messages");
    const q = query(messagesRef, orderBy("createdAt", "asc"));

    onSnapshot(q, snapshot => {
      if (snapshot.empty) {
        messagesContainer.innerHTML = `<div class="empty-chat">C'est le début de votre discussion avec ${recipientName}. Envoyez un premier message ! ⚡</div>`;
        return;
      }

      let html = "";
      snapshot.forEach(docSnap => {
        const msg = docSnap.data();
        const isSent = msg.senderId === currentUser.uid;
        const time = msg.createdAt?.toDate ? msg.createdAt.toDate().toLocaleTimeString("fr-FR", { hour: '2-digit', minute: '2-digit' }) : "À l'instant";

        html += `
          <div class="message ${isSent ? 'sent' : 'received'}">
            <div>${escapeHTML(msg.text)}</div>
            <div class="message-time">${time}</div>
          </div>
        `;
      });

      messagesContainer.innerHTML = html;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, error => {
      console.error("Erreur Firestore :", error);
    });
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !currentUser || !chatId) return;

    messageInput.value = "";

    try {
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: currentUser.uid,
        senderName: currentUser.displayName || currentUser.email?.split("@")[0] || "Membre",
        text: text,
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error("Erreur d'envoi :", err);
      alert("Impossible d'envoyer le message. Vérifie ta connexion ou les règles Firestore.");
    }
  });

  function escapeHTML(str) {
    return String(str ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
  }
</script>

</body>
</html>
