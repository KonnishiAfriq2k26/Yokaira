<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08091e">
<title>Discussions — YOKAIRA</title>

<style>
:root {
    --bg: #08091e;
    --panel: rgba(17, 19, 55, .88);
    --border: rgba(139, 103, 255, .24);
    --purple: #a56aff;
    --purple-light: #c3a1ff;
    --text: #f7f5ff;
    --muted: #a5a0d6;
    --green: #00e7a1;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; background: var(--bg); }
body {
    min-height: 100vh;
    color: var(--text);
    font-family: Arial, sans-serif;
    background:
        radial-gradient(ellipse at 80% 8%, rgba(112, 42, 210, .25), transparent 34%),
        radial-gradient(ellipse at 0% 48%, rgba(36, 37, 126, .25), transparent 40%),
        linear-gradient(180deg, #07091e 0%, #090b23 55%, #060817 100%);
    padding-bottom: 95px;
}

header {
    position: relative;
    padding: 24px 20px 18px;
    background: linear-gradient(135deg, rgba(10, 12, 39, .98), rgba(19, 13, 54, .78));
    border-bottom: 1px solid rgba(151, 106, 255, .15);
}

.brand { font-size: 28px; font-weight: 900; letter-spacing: -2px; }
.brand span { color: var(--purple); text-shadow: 0 0 20px rgba(165, 106, 255, .65); }
.tagline { margin-top: 5px; font-size: 10px; letter-spacing: 1.5px; color: var(--purple-light); font-weight: bold; }

.header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.new-chat {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(169, 117, 255, .6); color: white; font-size: 26px;
    background: rgba(87, 52, 157, .22); cursor: pointer; display: grid; place-items: center;
}
h1 { margin-top: 20px; font-size: 32px; font-weight: 850; }

.search-wrap { padding: 0 18px; margin-top: 8px; }
.search-box {
    display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 50px;
    border: 1px solid var(--border); border-radius: 30px; background: rgba(30, 29, 75, .76);
}
.search-box input { width: 100%; background: transparent; border: 0; outline: none; color: white; font-size: 16px; }

#conversationList { padding: 15px 18px; display: flex; flex-direction: column; gap: 10px; }
.conversation-item {
    display: flex; align-items: center; gap: 14px; padding: 12px; background: rgba(17, 19, 55, .7);
    border: 1px solid var(--border); border-radius: 16px; cursor: pointer; text-decoration: none; color: white; transition: .2s;
}
.conversation-item:hover { border-color: var(--purple); background: rgba(32, 31, 80, .9); }

.avatar {
    width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #ec4899);
    display: grid; place-items: center; font-weight: bold; font-size: 1.1rem; object-fit: cover; flex-shrink: 0;
}

.conv-info { flex: 1; min-width: 0; }
.conv-name { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
.conv-last { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty-state { padding: 40px 15px; text-align: center; color: var(--muted); line-height: 1.6; }

/* MODALE DE RECHERCHE */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(5, 5, 25, 0.85); backdrop-filter: blur(8px);
    z-index: 100000; display: none; place-items: center; padding: 20px;
}
.modal-overlay.active { display: grid; }
.modal-card { width: 100%; max-width: 450px; background: #111337; border: 1px solid var(--border); border-radius: 22px; padding: 24px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.modal-header h3 { color: var(--purple-light); }
.close-modal { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }
.modal-search-input { width: 100%; padding: 12px; background: #090918; border: 1px solid var(--border); border-radius: 12px; color: white; outline: none; margin-bottom: 12px; }
.users-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.user-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #19192e; border-radius: 12px; cursor: pointer; color: white; text-decoration: none; }
.user-item:hover { border: 1px solid var(--purple); }

/* VRAIE BARRE DE NAVIGATION OFFICIELLE */
.yokaira-bottom-nav {
    position: fixed; z-index: 99999; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 4px max(10px, env(safe-area-inset-bottom));
    background: rgba(8, 9, 30, .97); backdrop-filter: blur(18px);
    border-top: 1px solid rgba(144, 111, 255, .35); border-radius: 22px 22px 0 0;
}
.nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    text-decoration: none; color: #9892d4; font-size: 10px; white-space: nowrap;
}
.nav-icon { font-size: 23px; line-height: 1.2; }
.nav-item.active { color: var(--purple); font-weight: bold; }
.nav-item.active .nav-icon { text-shadow: 0 0 16px var(--purple); }

@media (min-width: 700px) {
    body { max-width: 760px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .yokaira-bottom-nav { left: 50%; right: auto; width: 100%; max-width: 760px; transform: translateX(-50%); }
}
</style>
</head>

<body>

<header>
    <div class="header-row">
        <div>
            <div class="brand">Y<span>◈</span>KAIRA</div>
            <div class="tagline">PLUS QU'UNE COMMUNAUTÉ, UNE FAMILLE.</div>
        </div>
        <button class="new-chat" id="newChatButton" aria-label="Nouvelle discussion">＋</button>
    </div>
    <h1>Discussions</h1>
</header>

<div class="search-wrap">
    <div class="search-box">
        <span style="color:var(--purple-light)">⌕</span>
        <input id="searchInput" type="search" placeholder="Rechercher une discussion..." autocomplete="off">
    </div>
</div>

<main>
    <div id="conversationList">
        <div class="empty-state">Chargement de vos discussions...</div>
    </div>
</main>

<!-- MODALE DE RECHERCHE -->
<div id="searchModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>💬 Nouvelle discussion</h3>
            <button id="closeModal" class="close-modal">✕</button>
        </div>
        <input type="text" id="memberSearchInput" class="modal-search-input" placeholder="Rechercher un membre..." autocomplete="off">
        <div id="searchResults" class="users-list">
            <div style="text-align: center; color: var(--muted); font-size: .85rem; padding: 10px;">Tape un nom...</div>
        </div>
    </div>
</div>

<!-- BARRE DE NAVIGATION OFFICIELLE -->
<nav class="yokaira-bottom-nav">
    <a class="nav-item" href="univers.html">
        <span class="nav-icon">🌌</span>
        <span>Univers</span>
    </a>
    <a class="nav-item active" href="messages.html">
        <span class="nav-icon">💬</span>
        <span>Discussions</span>
    </a>
    <a class="nav-item" href="boutique.html">
        <span class="nav-icon">🛍️</span>
        <span>Boutique</span>
    </a>
    <a class="nav-item" href="avatar.html">
        <span class="nav-icon">👤</span>
        <span>Avatar</span>
    </a>
    <a class="nav-item" href="profil.html">
        <span class="nav-icon">⚡</span>
        <span>Profil</span>
    </a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, limit } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAGfNN8L3Nepdn8D9ocz9ylVB_6mKbIVcI",
        authDomain: "yokaira-46d8f.firebaseapp.com",
        projectId: "yokaira-46d8f",
        storageBucket: "yokaira-46d8f.firebasestorage.app",
        messagingSenderId: "1074371889355",
        appId: "1:1074371889355:web:e358704dd8d7b1a2ceb34e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const newChatButton = document.getElementById("newChatButton");
    const searchModal = document.getElementById("searchModal");
    const closeModal = document.getElementById("closeModal");
    const memberSearchInput = document.getElementById("memberSearchInput");
    const searchResults = document.getElementById("searchResults");
    const conversationList = document.getElementById("conversationList");

    newChatButton.addEventListener("click", () => searchModal.classList.add("active"));
    closeModal.addEventListener("click", () => searchModal.classList.remove("active"));
    searchModal.addEventListener("click", (e) => { if (e.target === searchModal) searchModal.classList.remove("active"); });

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.replace("./connexion.html");
            return;
        }
        loadUserConversations(user.uid);
    });

    async function loadUserConversations(currentUid) {
        try {
            const snap = await getDocs(query(collection(db, "privateMessages"), limit(200)));
            const chatsMap = new Map();

            snap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.chatId && data.chatId.includes(currentUid)) {
                    const ids = data.chatId.split("_");
                    const partnerId = ids[0] === currentUid ? ids[1] : ids[0];
                    if (!chatsMap.has(partnerId) || (data.createdAt && chatsMap.get(partnerId).createdAt && data.createdAt > chatsMap.get(partnerId).createdAt)) {
                        chatsMap.set(partnerId, {
                            partnerId,
                            lastText: data.text || "[Image]",
                            createdAt: data.createdAt
                        });
                    }
                }
            });

            if (chatsMap.size === 0) {
                conversationList.innerHTML = `<div class="empty-state">Aucune discussion active.<br>Clique sur le bouton <strong>＋</strong> en haut pour démarrer une conversation.</div>`;
                return;
            }

            const postsSnap = await getDocs(query(collection(db, "posts"), limit(100)));
            const namesMap = new Map();
            postsSnap.forEach(p => {
                const d = p.data();
                if (d.authorId && d.authorName) namesMap.set(d.authorId, d.authorName);
            });

            let html = "";
            for (let [partnerId, info] of chatsMap.entries()) {
                const name = namesMap.get(partnerId) || "Membre YOKAIRA";
                const initial = name.charAt(0).toUpperCase();
                const savedPhoto = localStorage.getItem("yokairaProfilePhoto_" + partnerId);
                const avatarHTML = savedPhoto ? `<img src="${savedPhoto}" class="avatar" alt="">` : `<div class="avatar">${initial}</div>`;

                html += `
                    <a href="chat.html?id=${partnerId}&name=${encodeURIComponent(name)}" class="conversation-item">
                        ${avatarHTML}
                        <div class="conv-info">
                            <div class="conv-name">${name}</div>
                            <div class="conv-last">${escapeHTML(info.lastText)}</div>
                        </div>
                    </a>
                `;
            }
            conversationList.innerHTML = html;

        } catch (err) {
            console.error(err);
            conversationList.innerHTML = `<div class="empty-state">Erreur de chargement des discussions.</div>`;
        }
    }

    memberSearchInput.addEventListener("input", async (e) => {
        const term = e.target.value.trim().toLowerCase();
        if (term.length < 2) {
            searchResults.innerHTML = `<div style="text-align: center; color: var(--muted); font-size: .85rem; padding: 10px;">Tape au moins 2 caractères...</div>`;
            return;
        }
        try {
            const snap = await getDocs(query(collection(db, "posts"), limit(50)));
            const usersMap = new Map();
            snap.forEach(doc => {
                const d = doc.data();
                if (d.authorId && d.authorName && d.authorId !== auth.currentUser?.uid) {
                    usersMap.set(d.authorId, d.authorName);
                }
            });
            const matched = Array.from(usersMap.entries()).map(([id, name]) => ({ id, name })).filter(u => u.name.toLowerCase().includes(term));
            
            if (matched.length === 0) {
                searchResults.innerHTML = `<div style="text-align: center; color: var(--muted); padding: 10px;">Aucun membre trouvé.</div>`;
                return;
            }

            let html = "";
            matched.forEach(user => {
                const initial = user.name.charAt(0).toUpperCase();
                html += `
                    <a href="chat.html?id=${user.id}&name=${encodeURIComponent(user.name)}" class="user-item">
                        <div class="avatar" style="width:36px;height:36px;font-size:0.8rem;">${initial}</div>
                        <div><strong>${user.name}</strong><br><small style="color:var(--muted)">Membre YOKAIRA</small></div>
                    </a>
                `;
            });
            searchResults.innerHTML = html;
        } catch (err) { console.error(err); }
    });

    function escapeHTML(str) {
        return String(str ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
    }
</script>

</body>
</html>
