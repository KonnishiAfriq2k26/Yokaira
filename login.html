<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — YOKAIRA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <a href="index.html" class="logo">YOKAIRA</a>
            </div>

            <h1>Connexion</h1>

            <p class="auth-subtitle">
                Heureux de te revoir sur YOKAIRA
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginUsername">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        placeholder="Ton pseudo"
                        autocomplete="username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="loginPassword">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Ton mot de passe"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <button type="submit" class="auth-button">
                    Se connecter
                </button>

            </form>


            <p class="auth-switch">
                Pas encore de compte ?
                <a href="register.html">Créer un compte</a>
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
