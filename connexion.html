<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b20">

    <title>Connexion — YOKAIRA</title>

    <link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">


    <style>
        .connexion-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
        }

        .connexion-box {
            width: 100%;
            max-width: 420px;
        }

        .connexion-logo img {
            width: 130px;
            max-width: 45%;
            height: auto;
            margin-bottom: 20px;
        }

        .connexion-box h1 {
            margin-bottom: 12px;
        }

        .connexion-description {
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .connexion-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .connexion-actions .button {
            display: block;
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }

        .connexion-retour {
            display: inline-block;
            margin-top: 28px;
            color: inherit;
            text-decoration: none;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <main class="connexion-page">

        <div class="connexion-box">

            <a href="index.html" class="connexion-logo">
                <img src="logo.png" alt="Logo YOKAIRA">
            </a>

            <p class="subtitle">
                TON AVENTURE COMMENCE ICI
            </p>

            <h1>Bienvenue dans YOKAIRA</h1>

            <p class="connexion-description">
                Rejoins une communauté de passionnés d'anime,
                de manga, de gaming, de cosplay et de création africaine.
            </p>

            <div class="connexion-actions">

                <a href="register.html" class="button">
                    Créer un compte
                </a>

                <a href="login.html" class="button">
                    Se connecter
                </a>

            </div>

            <a href="index.html" class="connexion-retour">
                ← Retour à l'accueil
            </a>

        </div>

    </main>

</body>

</html>
